name: Publish Package

on:
  push:
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: "Publish to npmjs.com"
    runs-on: ubuntu-latest
    if: github.repository == 'lanekassen/portal-komponenter'
    permissions:
      id-token: write # Required for OIDC
    concurrency:
      group: release-npm-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # 6.0.8
        with:
          cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          # never use caching in release builds
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Publish
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: pnpm publish-packages
          # Trenger å eksplisitt sette denne for å unngå at den prøver å lage og pushe tags av seg selv
          # https://github.com/changesets/action/issues/247#issuecomment-4456317151
          createGithubReleases: false
        env:
          # Trenger å eksplisitt sette denne til en tom streng for å bruke Trusted Publishing
          # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
          NPM_TOKEN: ""